[project]
authors = ["Hameer Abbasi <2190658+hameerabbasi@users.noreply.github.com>"]
channels = ["conda-forge"]
description = "Add a short description here"
name = "galley-jl-python"
platforms = ["osx-arm64"]
version = "0.2.12"

[tasks]
compile = "python -c 'import galley_jl_python'"

[dependencies]
python = ">=3.10,<3.13"
juliaup = ">=1.17.10,<2"

[pypi-dependencies]
galley-jl-python = { path = ".", editable = true }
juliapkg = ">=0.1.16,<0.2"
juliacall = ">=0.9.24,<0.10"
numpy = ">=1.19"
finch-tensor = ">=0.7.0,<0.8.0"

[feature.test.pypi-dependencies]
pytest = "*"
pytest-cov = "*"
sparse = ">=0.16,<0.17"
numba = ">=0.61"
scipy = "*"
numpy = "==2.*"
pytest-xdist = ">=3.6.1,<4"

[feature.test.tasks]
test = { cmd = "pytest", depends-on = ["compile"] }

[environments]
test = ["test"]
