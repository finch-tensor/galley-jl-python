[project]
name = "galley-jl-python"
version = "0.2.14"
description = "Sparse Tensor Programming in Python powered by Finch.jl"
readme = "README.md"
authors = [{name = "Willow Ahrens", email = "willow.marie.ahrens@gmail.com"}]
requires-python = ">=3.11,<4.0"
dependencies = [
    "juliapkg (>=0.1.16,<0.2.0)",
    "numpy (>=1.19,<2.4)",
    "numba>=0.61,<0.63.1",
    "juliacall (>=0.9.24,<0.10.0)",
    "lark (>=1.3.0,<2.0.0)",
    "finch-tensor>=0.7.0,<0.8.0",
]

[tool.poetry]
packages = [{include = "galley_jl_python", from = "src"}]
requires-poetry = ">=2.0,<3.0"

[project.optional-dependencies]
test = [
    "pytest>=7.4.4,<7.6",
    "pre-commit>=3.6.0,<3.9",
    "pytest-cov>=4.1.0,<4.2",
    "sparse>=0.17.0,<0.17.1",
    "scipy>=1.7,<1.17",
    "hypothesis (>=6.151.9,<7.0.0)",
    "ndindex (>=1.10.1,<2.0.0)",
    "pytest-json-report (>=1.5.0,<2.0.0)",
    "pytest-xdist>=3.6.1,<4",
]

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
    { name = "linux-amd64", platform = "linux-64", glibc = "2.34" },
    { name = "linux-arm64", platform = "linux-aarch64", glibc = "2.34" },
    { name = "macos-arm64", platform = "osx-arm64", macos = "15.0" },
    { name = "win-amd64", platform = "win-64" },
]

[tool.pixi.dependencies]
python = ">=3.11,<3.14"

[tool.pixi.pypi-dependencies]
galley-jl-python = { path = ".", editable = true }

[tool.pixi.tasks]
# pixi has no post-install hook, so the entry-point tasks fetch the sysimage
compile = { cmd = "python -c 'import galley_jl_python'", depends-on = ["fetch-sysimage"] }
build-sysimage = "python scripts/sysimage/build.py"
fetch-sysimage = "python scripts/sysimage/fetch.py"

[tool.pixi.feature.test.tasks]
test = { cmd = "pytest", depends-on = ["compile"] }

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.environments]
test = { features = ["test"], solve-group = "default" }
test-py311 = ["test", "py311"]
test-py312 = ["test", "py312"]
test-py313 = ["test", "py313"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "YTT", "BLE", "C4", "T10", "ISC", "ICN", "PIE", "PYI", "RSE", "RET", "SIM", "PGH", "FLY", "NPY", "PERF", "RUF022"]
ignore = ["PYI024"]

[tool.ruff.lint.isort.sections]
numpy = ["numpy", "numpy.*", "scipy", "scipy.*"]
pytest = ["pytest", "pytest.*"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "pytest",
    "numpy",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.mypy]
ignore_missing_imports = true
