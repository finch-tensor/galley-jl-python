name: CI
jobs:
  test:
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest]
        environment: [test-py311, test-py312, test-py313]
        include:
          - os: macos-latest
            environment: test-py311
          - os: windows-latest
            environment: test-py311
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.72.2
          environments: ${{ matrix.environment }}
      - name: Run tests
        run: |
          pixi run -e ${{ matrix.environment }} test \
            --junit-xml=test-${{ matrix.os }}-${{ matrix.environment }}.xml
      - uses: codecov/codecov-action@v7

on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
